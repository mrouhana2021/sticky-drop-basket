<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Hold up an orange sticky note to your camera and bounce balls into the hoop -- works on phone or desktop, right in the browser." />
  <title>Sticky Bounce Basketball</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #07070b;
      --panel-bg:    rgba(16, 13, 21, 0.8);
      --accent:      #ff5a1f;   /* basketball orange */
      --accent-2:    #ffb347;   /* warm gold */
      --accent-blue: #4d96ff;   /* 2P / cool accent */
      --win-gold:    #ffd93d;
      --text:        #f5f3f0;
      --text-dim:    rgba(245, 243, 240, 0.66);
      --font-display: 'Orbitron', 'Arial Narrow', sans-serif;
      --font-body:    'Rajdhani', Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--bg);
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      height: 100%;
    }
    body {
      overflow: hidden; display: flex; justify-content: center; align-items: center;
      height: 100vh; height: 100dvh; font-family: var(--font-body);
    }
    canvas { display: block; }
    #stage { position: relative; display: inline-block; line-height: 0; }

    #overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #overlay.hidden { display: none; }

    .panel {
      pointer-events: auto;
      background:
        linear-gradient(var(--panel-bg), var(--panel-bg)) padding-box,
        linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
      border: 2px solid transparent;
      border-radius: 22px;
      padding: 42px 50px;
      text-align: center;
      color: var(--text);
      min-width: 300px;
      max-width: min(420px, 88vw);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.03);
      animation: panelIn 0.38s cubic-bezier(.2,.9,.25,1.25);
    }
    @keyframes panelIn {
      from { opacity: 0; transform: scale(0.88) translateY(14px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .panel h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(17px, 5.2vw, 23px);
      line-height: 1.4;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffffff, var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .panel h1.winner-title {
      font-size: clamp(19px, 6vw, 26px);
      background: linear-gradient(90deg, var(--win-gold), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .panel p {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      color: var(--text-dim);
      margin-bottom: 22px;
      line-height: 1.55;
    }
    .panel p b { color: var(--text); font-weight: 700; }
    .panel p.warn { color: #ff9a7a; }

    /* 2-player toggle switch */
    .toggle-row {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 26px; font-weight: 600; font-size: 15px;
      letter-spacing: 0.02em; cursor: pointer; user-select: none; color: var(--text-dim);
    }
    .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch .track {
      position: absolute; inset: 0; background: rgba(255,255,255,0.15);
      border-radius: 999px; transition: background 0.2s;
    }
    .switch .thumb {
      position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      background: #fff; border-radius: 50%; transition: transform 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .switch input:checked + .track { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .switch input:checked + .track .thumb { transform: translateX(20px); }

    .btn {
      font-family: var(--font-display);
      font-weight: 700; font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase;
      color: #1a0a02; background: linear-gradient(135deg, var(--accent-2), var(--accent));
      border: none; border-radius: 12px; padding: 15px 36px; cursor: pointer;
      position: relative; overflow: hidden; touch-action: manipulation;
      box-shadow: 0 8px 24px rgba(255, 90, 31, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover  { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 90, 31, 0.5); }
    .btn:active { transform: translateY(0) scale(0.97); }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
      transform: translateX(-100%);
    }
    .btn:hover::after { animation: shine 0.7s ease; }
    @keyframes shine { to { transform: translateX(100%); } }

    .countdown-num {
      font-family: var(--font-display);
      font-weight: 900; font-size: min(170px, 26vw); color: #fff;
      text-shadow: 0 0 50px rgba(255,90,30,0.9), 0 0 110px rgba(255,90,30,0.4);
      animation: countPop 0.45s cubic-bezier(.2,1.5,.4,1);
    }
    .countdown-num.small { font-size: min(100px, 18vw); }
    @keyframes countPop {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Mode selector (idle screen) */
    .mode-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
    .mode-row.sub { margin-top: -8px; margin-bottom: 24px; }
    .mode-btn {
      font-family: var(--font-body); font-weight: 700; font-size: 13px;
      letter-spacing: 0.02em; text-transform: uppercase;
      color: var(--text-dim); background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.15); border-radius: 999px;
      padding: 9px 16px; cursor: pointer; touch-action: manipulation;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .mode-btn.small { padding: 6px 14px; font-size: 12px; }
    .mode-btn.active {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      border-color: transparent; color: #1a0a02;
    }
    .mode-btn:hover:not(.active) { border-color: rgba(255,255,255,0.35); color: var(--text); }

    /* Duel (1v1 best-of-N) scoreboard */
    .duel-hud { display: flex; flex-direction: column; align-items: center; }
    .duel-scoreboard { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 14px 0; }
    .duel-side { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .duel-name {
      font-family: var(--font-display); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; color: var(--text-dim);
    }
    .duel-side.p1 .duel-name { color: var(--accent-blue); }
    .duel-side.p2 .duel-name { color: var(--accent); }
    .duel-pips { display: flex; gap: 6px; }
    .dpip {
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.3);
      display: inline-block;
    }
    .duel-side.p1 .dpip.filled { background: var(--accent-blue); border-color: var(--accent-blue); }
    .duel-side.p2 .dpip.filled { background: var(--accent); border-color: var(--accent); }
    .dpip.pop { animation: pipPop 0.5s cubic-bezier(.3,1.6,.4,1); }
    @keyframes pipPop {
      0%   { transform: scale(0.3); }
      50%  { transform: scale(1.6); }
      100% { transform: scale(1); }
    }
    .duel-round-label {
      font-family: var(--font-display); font-size: 13px; font-weight: 700;
      color: var(--text-dim); letter-spacing: 0.05em; white-space: nowrap;
    }
    .duel-turn-label {
      font-family: var(--font-display); font-weight: 700; font-size: clamp(14px, 4.5vw, 18px);
      line-height: 1.4; letter-spacing: 0.04em; margin: 8px 0 4px; color: #fff;
      text-shadow: 0 0 20px rgba(255,90,30,0.6);
    }
    .panel h1.p1-color, .panel h1.p2-color {
      background: none; -webkit-background-clip: initial; background-clip: initial;
    }
    .panel h1.p1-color { color: var(--accent-blue); }
    .panel h1.p2-color { color: var(--accent); }

    /* Persistent corner controls (camera flip / fullscreen) */
    #controls {
      position: absolute; bottom: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 10px;
      z-index: 5; pointer-events: none;
    }
    .icon-btn {
      width: 46px; height: 46px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      background: rgba(10,8,14,0.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #fff; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: auto; touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
    }
    .icon-btn:hover  { background: rgba(255,90,30,0.4); }
    .icon-btn:active { transform: scale(0.92); }

    #status {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.32); font: 600 12px/1 var(--font-body);
      letter-spacing: 0.03em; pointer-events: none; text-align: center; padding: 0 12px;
    }
  </style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="overlay" class="hidden"></div>
  <div id="controls">
    <button id="flipCamBtn" class="icon-btn" title="Switch camera" onclick="switchCamera()">🔄</button>
    <button id="fullscreenBtn" class="icon-btn" title="Fullscreen" onclick="toggleFullscreen()">⛶</button>
  </div>
</div>
<div id="status">F = fullscreen · D = debug outlines · use the icons on mobile</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
// ── Device detection ───────────────────────────────────────────────────────
// Real "is this a phone/tablet" check -- not just window shape. A laptop
// browser window that happens to be taller than wide should NOT switch to
// phone layout; only an actual touchscreen mobile device should.
function detectIsMobile() {
  const uaMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
  const hasTouch = (navigator.maxTouchPoints || 0) > 1 || 'ontouchstart' in window;
  return uaMobile && hasTouch;
}
const IS_MOBILE = detectIsMobile();

// ── Canvas / screen size ───────────────────────────────────────────────────
// A phone held in portrait gets a portrait-shaped canvas so the game
// actually fills the screen; a laptop always gets the standard 16:9
// layout regardless of how narrow the browser window is resized.
// fitCanvas() below CSS-scales whichever one is active to fit the real
// viewport.
const PORTRAIT = IS_MOBILE && window.innerHeight > window.innerWidth;
const W = PORTRAIT ? 720  : 1280;
const H = PORTRAIT ? 1280 : 720;

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = W;
canvas.height = H;

function fitCanvas() {
  const scale = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width  = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);
// Orientation flips would leave the fixed W/H mismatched with the new
// viewport shape (and the physics world sized for the old one) -- a full
// reload is the simplest way to rebuild everything cleanly for the new shape.
window.addEventListener('orientationchange', () => setTimeout(() => location.reload(), 200));


// ── Matter.js setup ────────────────────────────────────────────────────────
const { Engine, World, Bodies, Body, Events } = Matter;
const engine = Engine.create({ gravity: { x: 0, y: 1.5 } });
const world  = engine.world;

// Static boundary walls (floor + sides, no ceiling — balls enter from top)
World.add(world, [
  Bodies.rectangle(W / 2,  H + 50,  W,   100, { isStatic: true }),  // floor
  Bodies.rectangle(-50,    H / 2,   100, H,   { isStatic: true }),  // left
  Bodies.rectangle(W + 50, H / 2,   100, H,   { isStatic: true }),  // right
]);


// ── Ball management ────────────────────────────────────────────────────────
const BALL_RADIUS  = 18;
const BALL_COLORS  = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff9ff3', '#ff9f43', '#a29bfe'];
const SPAWN_INTERVAL_MS = 1400;
const MAX_BALLS    = 40;   // remove oldest when exceeded
const TRAIL_LENGTH = 14;
const DROP_X       = W / 2;  // where balls fall from -- also drives the drop indicator

const balls = [];

function spawnBall() {
  if (balls.length >= MAX_BALLS) {
    const oldest = balls.shift();
    World.remove(world, oldest);
  }

  const x    = DROP_X;
  const ball = Bodies.circle(x, -BALL_RADIUS - 10, BALL_RADIUS, {
    restitution: 0.65,
    friction:    0.08,
    frictionAir: 0.001,
    density:     0.002,
  });
  ball.gameColor = BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];
  ball.trail     = [];
  ball.prevY     = ball.position.y;  // for hoop-scoring crossing checks

  World.add(world, ball);
  balls.push(ball);
}

let lastSpawnTime = performance.now();  // used by the drop indicator's countdown ring
setInterval(() => {
  lastSpawnTime = performance.now();
  if (gameState === 'playing') spawnBall();
}, SPAWN_INTERVAL_MS);


// ── Sticky-note physics bodies ─────────────────────────────────────────────
let noteBodies = [];

function updateNotes(notes) {
  noteBodies.forEach(b => World.remove(world, b));
  noteBodies = [];

  for (const note of notes) {
    const angleRad = note.angle * Math.PI / 180;
    const body = Bodies.rectangle(note.x, note.y, note.width, note.height, {
      isStatic:    true,
      angle:       angleRad,
      friction:    0.3,
      restitution: 0.4,
    });
    noteBodies.push(body);
    World.add(world, body);
  }
}


// ── Basketball hoop ──────────────────────────────────────────────────────
// A rim made of two static posts the ball can bounce off, with a scoring
// gap between them. The hoop relocates to a new spot after every basket,
// so each of the 5 baskets in a round has to be aimed for fresh.
const RIM_GAP       = 110;  // gap between posts, in canvas px
const POST_RADIUS   = 8;
const HOOP_MARGIN   = 170;         // keep hoop away from the very edges
const HOOP_Y_MIN    = H * 0.38;    // lower/more reachable than the original top placement
const HOOP_Y_MAX    = H * 0.58;

const hoop = { x: W / 2, y: HOOP_Y_MIN, leftPost: null, rightPost: null, moveTime: 0 };
const scoreFX = [];  // floating "+1" / "HOOP MOVED!" text popups

function addScoreFX(x, y, text, big = false) {
  scoreFX.push({ x, y, text, big, start: performance.now() });
}

function placeHoopBodies(x, y) {
  if (hoop.leftPost)  World.remove(world, hoop.leftPost);
  if (hoop.rightPost) World.remove(world, hoop.rightPost);
  const leftPost  = Bodies.circle(x - RIM_GAP / 2, y, POST_RADIUS, { isStatic: true, restitution: 0.5, friction: 0.1 });
  const rightPost = Bodies.circle(x + RIM_GAP / 2, y, POST_RADIUS, { isStatic: true, restitution: 0.5, friction: 0.1 });
  World.add(world, [leftPost, rightPost]);
  hoop.leftPost  = leftPost;
  hoop.rightPost = rightPost;
}

function moveHoop() {
  hoop.x = HOOP_MARGIN + Math.random() * (W - 2 * HOOP_MARGIN);
  hoop.y = HOOP_Y_MIN + Math.random() * (HOOP_Y_MAX - HOOP_Y_MIN);
  hoop.moveTime = performance.now();
  placeHoopBodies(hoop.x, hoop.y);
}

moveHoop();  // initial placement (visible behind the start screen)

function checkHoopScoring() {
  if (gameState !== 'playing') return;

  // Must cross the rim's y-line moving downward AND pass through the
  // middle of the gap (not just clip a post) to count as a score.
  const gapHalf = RIM_GAP / 2 - BALL_RADIUS * 0.5;

  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    const { x, y } = ball.position;

    if (ball.prevY < hoop.y && y >= hoop.y && Math.abs(x - hoop.x) < gapHalf) {
      World.remove(world, ball);
      balls.splice(i, 1);

      roundMade++;
      addScoreFX(hoop.x, hoop.y, '+1');

      if (roundMade >= roundTarget) {
        finishRound();
      } else {
        moveHoop();
      }
    } else {
      ball.prevY = y;
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawHoop() {
  const { x, y } = hoop;
  const leftX  = x - RIM_GAP / 2;
  const rightX = x + RIM_GAP / 2;

  // Pop in with a quick fade after moving to a new spot.
  const age   = performance.now() - hoop.moveTime;
  const alpha = 0.4 + 0.6 * Math.min(1, age / 300);

  ctx.save();
  ctx.globalAlpha = alpha;

  // Backboard
  const boardW = RIM_GAP + 50, boardH = 14;
  ctx.fillStyle   = 'rgba(255,255,255,0.85)';
  ctx.strokeStyle = 'rgba(255,90,30,0.9)';
  ctx.lineWidth   = 3;
  roundRect(x - boardW / 2, y - 46, boardW, boardH, 6);
  ctx.fill();
  ctx.stroke();

  // Support arms down to the posts
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth   = 3;
  ctx.beginPath();
  ctx.moveTo(leftX, y - 32);  ctx.lineTo(leftX, y);
  ctx.moveTo(rightX, y - 32); ctx.lineTo(rightX, y);
  ctx.stroke();

  // Net -- a handful of strands curving down to a narrower bottom, plus
  // two horizontal "rings" for a woven look.
  const netBottomY    = y + 46;
  const netBottomHalf = RIM_GAP * 0.28;
  const strands       = 6;

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth   = 1.5;
  for (let i = 0; i <= strands; i++) {
    const t    = i / strands;
    const topX = leftX + t * (rightX - leftX);
    const botX = x - netBottomHalf + t * (netBottomHalf * 2);
    ctx.beginPath();
    ctx.moveTo(topX, y);
    ctx.quadraticCurveTo((topX + botX) / 2, y + 28, botX, netBottomY);
    ctx.stroke();
  }
  for (const f of [0.35, 0.7]) {
    ctx.beginPath();
    for (let i = 0; i <= strands; i++) {
      const t    = i / strands;
      const topX = leftX + t * (rightX - leftX);
      const botX = x - netBottomHalf + t * (netBottomHalf * 2);
      const rx   = topX + (botX - topX) * f;
      const ry   = y + (netBottomY - y) * f;
      if (i === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
    }
    ctx.stroke();
  }

  // Rim (drawn as a flattened ellipse for a slight 3D look)
  ctx.strokeStyle = '#ff5a1f';
  ctx.lineWidth   = 5;
  ctx.beginPath();
  ctx.ellipse(x, y, RIM_GAP / 2 + POST_RADIUS, 7, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Posts
  ctx.fillStyle = '#c23b0e';
  ctx.beginPath(); ctx.arc(leftX, y, POST_RADIUS, 0, Math.PI * 2);  ctx.fill();
  ctx.beginPath(); ctx.arc(rightX, y, POST_RADIUS, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // Score pips (roundTarget dots above the backboard, filled as you score)
  ctx.save();
  ctx.textAlign = 'center';
  for (let i = 0; i < roundTarget; i++) {
    const px = x - (roundTarget - 1) * 8 + i * 16;
    const py = y - 62;
    ctx.beginPath();
    ctx.arc(px, py, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = i < roundMade ? '#ffb347' : 'rgba(255,255,255,0.25)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

function drawScoreFX() {
  const now = performance.now();
  for (let i = scoreFX.length - 1; i >= 0; i--) {
    const fx = scoreFX[i];
    const t  = (now - fx.start) / (fx.big ? 1200 : 800);
    if (t >= 1) { scoreFX.splice(i, 1); continue; }

    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle   = fx.big ? '#ffd93d' : '#ff9f43';
    ctx.font        = fx.big ? '800 30px Orbitron, Arial, sans-serif' : '800 22px Orbitron, Arial, sans-serif';
    ctx.textAlign   = 'center';
    ctx.shadowBlur  = 10;
    ctx.shadowColor = ctx.fillStyle;
    ctx.fillText(fx.text, fx.x, fx.y - t * 40);
    ctx.restore();
  }
}


// ── Confetti (finish-line celebration) ─────────────────────────────────
const confetti = [];
const CONFETTI_COLORS = ['#ff5a1f', '#ffb347', '#ffd93d', '#4d96ff', '#6bcb77', '#ff9ff3'];

function spawnConfetti(x, y, count = 80) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 7;
    confetti.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      size: 4 + Math.random() * 5,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.3,
      life: 0,
      maxLife: 90 + Math.random() * 45,
    });
  }
}

function updateConfetti() {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.vy += 0.18;  // gravity
    p.x  += p.vx;
    p.y  += p.vy;
    p.rot += p.vrot;
    p.life++;
    if (p.life > p.maxLife) confetti.splice(i, 1);
  }
}

function drawConfetti() {
  for (const p of confetti) {
    const alpha = Math.max(0, 1 - p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    ctx.restore();
  }
}


// ── Camera + client-side note detection ─────────────────────────────────
// Everything runs in the browser: no server, no install. getUserMedia
// supplies the live video; a small offscreen canvas is sampled for orange
// blobs (HSV-thresholded, connected-components + PCA for an oriented box),
// the same technique the original Python/OpenCV version used, just ported
// to JS so it works for any visitor on any device.
const video = document.createElement('video');
video.playsInline = true;
video.muted = true;
video.setAttribute('playsinline', '');
video.autoplay = true;

let stream        = null;
// Laptops have one front-facing webcam, so default to 'user'. Phones/tablets
// default to the rear camera ('environment') -- the natural way to hold a
// phone up at a note is pointing the back of it outward, not a selfie.
// Either device can flip it with the camera button regardless of default.
let currentFacing  = IS_MOBILE ? 'environment' : 'user';

// On a phone, only the front camera should mirror -- the rear camera truly
// points away from you, so it should show what's really there. On a
// laptop, you're always sitting facing the screen no matter which webcam
// is selected (a second/external cam picked via the flip button isn't
// pointing away from you the way a phone's rear camera does), so keep
// mirroring on regardless of which camera is active.
function mirrorForFacing(facing) {
  return IS_MOBILE ? facing === 'user' : true;
}
let mirrored = mirrorForFacing(currentFacing);
let coverRect      = null;     // {sx,sy,sw,sh} crop of the video matching W:H
let cameraReady    = false;
let cameraError    = null;

function computeCoverRect(srcW, srcH, dstW, dstH) {
  const srcRatio = srcW / srcH, dstRatio = dstW / dstH;
  let sx, sy, sw, sh;
  if (srcRatio > dstRatio) {
    sh = srcH; sw = srcH * dstRatio; sx = (srcW - sw) / 2; sy = 0;
  } else {
    sw = srcW; sh = srcW / dstRatio; sx = 0; sy = (srcH - sh) / 2;
  }
  return { sx, sy, sw, sh };
}

// Draws the current (optionally mirrored) camera frame, cropped to match
// the target's aspect ratio ("object-fit: cover" style), into any canvas
// context. Used for both the visible game canvas and the tiny detection
// canvas, so detected coordinates always line up with what's on screen.
function drawVideoFrame(targetCtx, dstW, dstH) {
  if (!cameraReady || !coverRect) return false;
  targetCtx.save();
  if (mirrored) { targetCtx.translate(dstW, 0); targetCtx.scale(-1, 1); }
  targetCtx.drawImage(video, coverRect.sx, coverRect.sy, coverRect.sw, coverRect.sh, 0, 0, dstW, dstH);
  targetCtx.restore();
  return true;
}

function cameraErrorMessage(err) {
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    return 'Camera access requires a secure (https) connection.';
  }
  if (!err) return 'Could not access the camera.';
  if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
    return 'Camera access was denied. Allow the camera permission for this site, then retry.';
  }
  if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
    return 'No camera was found on this device.';
  }
  if (err.name === 'NotReadableError') {
    return 'The camera is already in use by another app. Close it and retry.';
  }
  return 'Could not access the camera (' + (err.message || err.name || 'unknown error') + ').';
}

async function startCamera(facing) {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  cameraReady = false;

  const attempts = [
    { audio: false, video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { audio: false, video: true },
  ];
  let lastErr = null;
  for (const constraints of attempts) {
    try { stream = await navigator.mediaDevices.getUserMedia(constraints); break; }
    catch (err) { lastErr = err; }
  }
  if (!stream) throw lastErr || new Error('getUserMedia failed');

  currentFacing = facing;
  mirrored = mirrorForFacing(facing);

  video.srcObject = stream;
  await video.play();
  if (video.readyState < 2) {
    await new Promise(resolve => { video.onloadedmetadata = resolve; });
  }

  coverRect   = computeCoverRect(video.videoWidth || W, video.videoHeight || H, W, H);
  cameraReady = true;
}

async function refreshCameraDeviceCount() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const count   = devices.filter(d => d.kind === 'videoinput').length;
    const btn     = document.getElementById('flipCamBtn');
    if (btn) btn.style.display = count > 1 ? 'flex' : 'none';
  } catch (e) { /* leave the button visible -- harmless if there's only one camera */ }
}

async function initCamera() {
  cameraError = null;
  renderOverlay();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    cameraError = cameraErrorMessage(null);
    renderOverlay();
    return;
  }
  try {
    await startCamera(currentFacing);
  } catch (err) {
    cameraError = cameraErrorMessage(err);
  }
  renderOverlay();
  refreshCameraDeviceCount();
}

async function switchCamera() {
  const next = currentFacing === 'user' ? 'environment' : 'user';
  try {
    await startCamera(next);
  } catch (err) {
    cameraError = cameraErrorMessage(err);
    renderOverlay();
  }
}

function toggleFullscreen() {
  const el = document.documentElement;
  const request = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  const exit    = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  try {
    if (!document.fullscreenElement) request && request.call(el);
    else exit && exit.call(document);
  } catch (e) { /* fullscreen isn't available on this browser (e.g. iOS Safari) -- ignore */ }
}

// ── Orange-note detection (HSV threshold + connected components + PCA) ────
const ORANGE_H_MIN = 5, ORANGE_H_MAX = 22;   // OpenCV-style hue scale, 0-180
const ORANGE_S_MIN = 130, ORANGE_V_MIN = 120;
const NOTE_ASPECT_MAX = 2.6;
const NOTE_FILL_MIN   = 0.35;

let detectCanvas, detectCtx, detectW, detectH;
function initDetectCanvas() {
  detectW = Math.max(120, Math.round(W / 8));
  detectH = Math.round(detectW * (H / W));  // keep the same aspect as W:H
  detectCanvas = document.createElement('canvas');
  detectCanvas.width  = detectW;
  detectCanvas.height = detectH;
  detectCtx = detectCanvas.getContext('2d', { willReadFrequently: true });
}

function rgbToHsv180(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r)      h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else                 h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  return { h: h / 2, s: s * 255, v: max * 255 };  // h/2 -> OpenCV's 0-180 scale
}

function detectNotes() {
  if (!drawVideoFrame(detectCtx, detectW, detectH)) return [];

  const w = detectW, h = detectH, total = w * h;
  let imgData;
  try { imgData = detectCtx.getImageData(0, 0, w, h); }
  catch (e) { return []; }
  const data = imgData.data;
  const mask = new Uint8Array(total);

  for (let p = 0, i = 0; p < total; p++, i += 4) {
    const { h: hue, s, v } = rgbToHsv180(data[i], data[i + 1], data[i + 2]);
    if (hue >= ORANGE_H_MIN && hue <= ORANGE_H_MAX && s >= ORANGE_S_MIN && v >= ORANGE_V_MIN) {
      mask[p] = 1;
    }
  }

  const visited = new Uint8Array(total);
  const stack   = new Int32Array(total);
  const minPx   = Math.max(10, total * 0.0009);
  const maxPx   = total * 0.08;
  const notes   = [];

  for (let start = 0; start < total; start++) {
    if (!mask[start] || visited[start]) continue;

    let sp = 0;
    stack[sp++] = start;
    visited[start] = 1;

    let count = 0, sumX = 0, sumY = 0, sumXX = 0, sumYY = 0, sumXY = 0;
    let minX = w, maxX = 0, minY = h, maxY = 0;

    while (sp > 0) {
      const cur = stack[--sp];
      const cy = (cur / w) | 0;
      const cx = cur - cy * w;
      count++;
      sumX += cx; sumY += cy;
      sumXX += cx * cx; sumYY += cy * cy; sumXY += cx * cy;
      if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
      if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;

      if (cx > 0)     { const n = cur - 1; if (mask[n] && !visited[n]) { visited[n] = 1; stack[sp++] = n; } }
      if (cx < w - 1) { const n = cur + 1; if (mask[n] && !visited[n]) { visited[n] = 1; stack[sp++] = n; } }
      if (cy > 0)     { const n = cur - w; if (mask[n] && !visited[n]) { visited[n] = 1; stack[sp++] = n; } }
      if (cy < h - 1) { const n = cur + w; if (mask[n] && !visited[n]) { visited[n] = 1; stack[sp++] = n; } }
    }

    if (count < minPx || count > maxPx) continue;

    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    if (Math.max(bw, bh) / Math.max(1, Math.min(bw, bh)) > NOTE_ASPECT_MAX) continue;
    if (count / (bw * bh) < NOTE_FILL_MIN) continue;

    const cx = sumX / count, cy = sumY / count;
    const varX  = sumXX / count - cx * cx;
    const varY  = sumYY / count - cy * cy;
    const covXY = sumXY / count - cx * cy;

    const trace   = varX + varY;
    const det     = varX * varY - covXY * covXY;
    const disc    = Math.sqrt(Math.max(0, trace * trace / 4 - det));
    const lambda1 = trace / 2 + disc;
    const lambda2 = Math.max(0, trace / 2 - disc);
    const angle   = (lambda1 - lambda2 > 1e-3) ? 0.5 * Math.atan2(2 * covXY, varX - varY) : 0;

    const scale = W / w;  // detect canvas shares W:H's aspect -- one scale fits both axes
    notes.push({
      x: cx * scale,
      y: cy * scale,
      width:  Math.max(14, Math.sqrt(12 * lambda1) * scale),
      height: Math.max(14, Math.sqrt(12 * lambda2) * scale),
      angle:  angle * 180 / Math.PI,
    });
  }

  return notes;
}

const DETECTION_INTERVAL_MS = 90;  // ~11fps, independent of the 60fps render loop
setInterval(() => {
  if (!cameraReady) return;
  updateNotes(detectNotes());
}, DETECTION_INTERVAL_MS);


// ── Competition mode ────────────────────────────────────────────────────
// idle (start screen) -> countdown (3, 2, 1, GO!) -> playing (timed race)
// -> finished (Retry, or Onto Player 2 / round-by-round in duel mode).
//
// Three modes:
//   'solo'   - race to RACE_TARGET baskets alone, against the clock.
//   'race2p' - both players race to RACE_TARGET baskets in turn; lower
//              total time wins.
//   'duel'   - best-of-3 or best-of-5: each round both players take one
//              single-basket turn, whoever is faster wins the round point;
//              first to a majority of round-wins takes the match.
const RACE_TARGET = 5;  // baskets needed to finish a solo/race2p round

let gameState      = 'idle';  // 'idle'|'countdown'|'playing'|'turnResult'|'roundResult'|'finished'
let matchMode      = 'solo';  // 'solo' | 'race2p' | 'duel'
let currentPlayer  = 1;       // whoever is currently shooting (1 or 2)
let playerTimes    = { 1: null, 2: null };  // race2p
let roundMade      = 0;       // baskets made so far this turn/round
let roundTarget    = RACE_TARGET;  // baskets needed to finish the CURRENT turn (5, or 1 in duel)
let roundStartTime = 0;
let finalTime      = 0;
let countdownText  = '3';

// Duel-only state
let duelSeriesLength = 3;               // 3 or 5
let duelScores       = { 1: 0, 2: 0 };  // round-wins so far
let duelRound         = 1;
let duelTurnPlayer   = 1;               // who's shooting this turn within the round
let duelRoundTimes   = { 1: null, 2: null };
let lastRoundResult  = { winner: 0, t1: 0, t2: 0, round: 0 };

function duelWinsNeeded() { return Math.ceil(duelSeriesLength / 2); }

const overlay = document.getElementById('overlay');

function formatTime(ms) {
  return (ms / 1000).toFixed(2) + 's';
}

function clearBalls() {
  for (const b of balls) World.remove(world, b);
  balls.length = 0;
}

function setMatchMode(mode) { matchMode = mode; renderOverlay(); }
function setDuelLength(n)   { duelSeriesLength = n; renderOverlay(); }

function duelScoreboardHtml(animateWinner) {
  const pipsFor = (player) => {
    let html = '';
    for (let i = 0; i < duelWinsNeeded(); i++) {
      const filled = i < duelScores[player];
      const isNew  = animateWinner === player && i === duelScores[player] - 1;
      html += `<span class="dpip ${filled ? 'filled' : ''} ${isNew ? 'pop' : ''}"></span>`;
    }
    return html;
  };
  return `
    <div class="duel-scoreboard">
      <div class="duel-side p1">
        <div class="duel-name">PLAYER 1</div>
        <div class="duel-pips">${pipsFor(1)}</div>
      </div>
      <div class="duel-round-label">ROUND ${duelRound}/${duelSeriesLength}</div>
      <div class="duel-side p2">
        <div class="duel-name">PLAYER 2</div>
        <div class="duel-pips">${pipsFor(2)}</div>
      </div>
    </div>`;
}

function renderOverlay() {
  if (gameState === 'idle') {
    overlay.classList.remove('hidden');

    let statusHtml, buttonLabel, buttonAction;
    if (cameraError) {
      statusHtml   = `<p class="warn">⚠ ${cameraError}</p>`;
      buttonLabel  = 'Retry Camera';
      buttonAction = 'initCamera()';
    } else if (!cameraReady) {
      statusHtml   = `<p>Requesting camera access…</p>`;
      buttonLabel  = 'Start';
      buttonAction = 'beginMatch()';
    } else {
      const desc = matchMode === 'solo'
        ? `Sink <b>${RACE_TARGET}</b> baskets as fast as you can!`
        : matchMode === 'race2p'
        ? `Both players race to <b>${RACE_TARGET}</b> baskets — fastest total time wins.`
        : `Best of <b>${duelSeriesLength}</b>: each round, whoever sinks their basket fastest scores a point.`;
      statusHtml   = `<p>${desc}</p>`;
      buttonLabel  = 'Start';
      buttonAction = 'beginMatch()';
    }

    const modeRow = `
      <div class="mode-row">
        <button class="mode-btn ${matchMode === 'solo'   ? 'active' : ''}" onclick="setMatchMode('solo')">Solo</button>
        <button class="mode-btn ${matchMode === 'race2p' ? 'active' : ''}" onclick="setMatchMode('race2p')">2P Race</button>
        <button class="mode-btn ${matchMode === 'duel'   ? 'active' : ''}" onclick="setMatchMode('duel')">1v1 Duel</button>
      </div>`;
    const duelSubRow = matchMode === 'duel' ? `
      <div class="mode-row sub">
        <button class="mode-btn small ${duelSeriesLength === 3 ? 'active' : ''}" onclick="setDuelLength(3)">Best of 3</button>
        <button class="mode-btn small ${duelSeriesLength === 5 ? 'active' : ''}" onclick="setDuelLength(5)">Best of 5</button>
      </div>` : '';

    overlay.innerHTML = `
      <div class="panel">
        <h1>🏀 STICKY BOUNCE BASKETBALL</h1>
        ${statusHtml}
        ${modeRow}
        ${duelSubRow}
        <button class="btn" onclick="${buttonAction}">${buttonLabel}</button>
      </div>`;

  } else if (gameState === 'countdown') {
    overlay.classList.remove('hidden');
    if (matchMode === 'duel') {
      overlay.innerHTML = `
        <div class="duel-hud">
          ${duelScoreboardHtml(0)}
          <div class="duel-turn-label">PLAYER ${duelTurnPlayer}'S SHOT</div>
          <div class="countdown-num small">${countdownText}</div>
        </div>`;
    } else {
      overlay.innerHTML = `<div class="countdown-num">${countdownText}</div>`;
    }

  } else if (gameState === 'turnResult') {
    overlay.classList.remove('hidden');
    const p = duelTurnPlayer;
    overlay.innerHTML = `
      <div class="duel-hud">
        ${duelScoreboardHtml(0)}
        <h1 class="${p === 1 ? 'p1-color' : 'p2-color'}">PLAYER ${p}: ${formatTime(duelRoundTimes[p])}</h1>
        <p>Player ${p === 1 ? 2 : 1}, get ready…</p>
      </div>`;

  } else if (gameState === 'roundResult') {
    overlay.classList.remove('hidden');
    const { winner, t1, t2, round } = lastRoundResult;
    overlay.innerHTML = `
      <div class="panel">
        <h1 class="${winner === 1 ? 'p1-color' : 'p2-color'}">PLAYER ${winner} WINS ROUND ${round}!</h1>
        <p>${formatTime(t1)} &nbsp;vs&nbsp; ${formatTime(t2)}</p>
        ${duelScoreboardHtml(winner)}
      </div>`;

  } else if (gameState === 'finished') {
    overlay.classList.remove('hidden');
    let body;
    if (matchMode === 'duel') {
      const matchWinner = duelScores[1] > duelScores[2] ? 1 : 2;
      body = `
        <h1 class="winner-title">🏆 PLAYER ${matchWinner} WINS THE MATCH!</h1>
        <p>Final score: <b>${duelScores[1]} - ${duelScores[2]}</b></p>
        <button class="btn" onclick="resetMatch()">Retry</button>`;
    } else if (matchMode === 'race2p' && currentPlayer === 1) {
      body = `
        <h1>PLAYER 1 FINISHED</h1>
        <p>Time: <b>${formatTime(finalTime)}</b></p>
        <button class="btn" onclick="goToPlayer2()">Onto Player 2 →</button>`;
    } else if (matchMode === 'race2p' && currentPlayer === 2) {
      const t1 = playerTimes[1], t2 = playerTimes[2];
      const winner = t1 < t2 ? '🏆 PLAYER 1 WINS' : t2 < t1 ? '🏆 PLAYER 2 WINS' : "🤝 IT'S A TIE";
      body = `
        <h1 class="winner-title">${winner}</h1>
        <p>Player 1: <b>${formatTime(t1)}</b><br>Player 2: <b>${formatTime(t2)}</b></p>
        <button class="btn" onclick="resetMatch()">Retry</button>`;
    } else {
      body = `
        <h1>FINISHED!</h1>
        <p>Time: <b>${formatTime(finalTime)}</b></p>
        <button class="btn" onclick="resetMatch()">Retry</button>`;
    }
    overlay.innerHTML = `<div class="panel">${body}</div>`;

  } else {
    overlay.classList.add('hidden');
    overlay.innerHTML = '';
  }
}

function startCountdown() {
  clearBalls();
  roundMade   = 0;
  roundTarget = matchMode === 'duel' ? 1 : RACE_TARGET;
  if (matchMode === 'duel') currentPlayer = duelTurnPlayer;
  moveHoop();
  gameState     = 'countdown';
  countdownText = '3';
  renderOverlay();

  const steps = ['2', '1', 'GO!'];
  steps.forEach((label, i) => {
    setTimeout(() => { countdownText = label; renderOverlay(); }, (i + 1) * 800);
  });
  setTimeout(() => {
    gameState      = 'playing';
    roundStartTime = performance.now();
    renderOverlay();
  }, (steps.length + 1) * 800);
}

function finishRound() {
  finalTime = performance.now() - roundStartTime;

  if (matchMode === 'duel') {
    duelRoundTimes[duelTurnPlayer] = finalTime;

    if (duelTurnPlayer === 1) {
      // Player 1 just finished their shot -- show it briefly, then let
      // Player 2 go. Deferred so we never call clearBalls() (via the next
      // startCountdown) while checkHoopScoring() is still mid-loop over balls.
      gameState = 'turnResult';
      renderOverlay();
      setTimeout(() => {
        duelTurnPlayer = 2;
        startCountdown();
      }, 1400);
      return;
    }

    // Both players have now shot this round -- resolve it.
    const t1 = duelRoundTimes[1], t2 = duelRoundTimes[2];
    if (t1 === t2) {
      // Practically never happens (ms-precision timing), but handle it
      // cleanly: replay the round rather than picking an arbitrary winner.
      overlay.classList.remove('hidden');
      overlay.innerHTML = `<div class="panel"><h1>EXACT TIE!</h1><p>Replaying round ${duelRound}…</p></div>`;
      setTimeout(() => {
        duelRoundTimes = { 1: null, 2: null };
        duelTurnPlayer = 1;
        startCountdown();
      }, 1400);
      return;
    }

    const roundWinner = t1 < t2 ? 1 : 2;
    duelScores[roundWinner]++;
    lastRoundResult = { winner: roundWinner, t1, t2, round: duelRound };
    gameState = 'roundResult';
    spawnConfetti(W / 2, H * 0.3, 50);
    renderOverlay();

    setTimeout(() => {
      if (duelScores[roundWinner] >= duelWinsNeeded()) {
        gameState = 'finished';
        spawnConfetti(W / 2, H * 0.3, 150);
        renderOverlay();
      } else {
        duelRound++;
        duelRoundTimes = { 1: null, 2: null };
        duelTurnPlayer = 1;
        startCountdown();
      }
    }, 2200);
    return;
  }

  // solo / race2p
  playerTimes[currentPlayer] = finalTime;
  gameState = 'finished';
  const isFinalResult = matchMode === 'solo' || currentPlayer === 2;
  spawnConfetti(W / 2, H * 0.3, isFinalResult ? 150 : 80);
  renderOverlay();
}

function beginMatch() {
  if (!cameraReady) { initCamera(); return; }

  if (matchMode === 'duel') {
    duelScores     = { 1: 0, 2: 0 };
    duelRound      = 1;
    duelTurnPlayer = 1;
    duelRoundTimes = { 1: null, 2: null };
  } else {
    playerTimes = { 1: null, 2: null };
  }
  currentPlayer = 1;
  startCountdown();
}

function goToPlayer2() {
  currentPlayer = 2;
  startCountdown();
}

function resetMatch() {
  gameState = 'idle';
  renderOverlay();
}

renderOverlay();  // show the start screen
initDetectCanvas();
initCamera();     // ask for camera access right away so the preview is live behind the start screen


// ── Cleanup balls that fell off screen ────────────────────────────────────
function cleanup() {
  for (let i = balls.length - 1; i >= 0; i--) {
    if (balls[i].position.y > H + 200) {
      World.remove(world, balls[i]);
      balls.splice(i, 1);
    }
  }
}


// ── Rendering ─────────────────────────────────────────────────────────────
let debugMode = false;

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function drawBalls() {
  for (const ball of balls) {
    const { x, y } = ball.position;

    // Update trail
    ball.trail.push({ x, y });
    if (ball.trail.length > TRAIL_LENGTH) ball.trail.shift();

    // Draw trail
    const rgb = hexToRgb(ball.gameColor);
    for (let i = 1; i < ball.trail.length; i++) {
      const alpha = (i / ball.trail.length) * 0.35;
      const width = BALL_RADIUS * 1.2 * (i / ball.trail.length);
      ctx.beginPath();
      ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
      ctx.lineWidth   = width;
      ctx.lineCap     = 'round';
      ctx.moveTo(ball.trail[i - 1].x, ball.trail[i - 1].y);
      ctx.lineTo(ball.trail[i].x,     ball.trail[i].y);
      ctx.stroke();
    }

    // Glow + ball
    ctx.save();
    ctx.shadowBlur  = 28;
    ctx.shadowColor = ball.gameColor;
    ctx.fillStyle   = ball.gameColor;
    ctx.beginPath();
    ctx.arc(x, y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // Specular highlight
    ctx.shadowBlur  = 0;
    ctx.fillStyle   = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(x - BALL_RADIUS * 0.3, y - BALL_RADIUS * 0.3, BALL_RADIUS * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawNoteOutlines() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 80, 80, 0.75)';
  ctx.lineWidth   = 2;
  for (const body of noteBodies) {
    const verts = body.vertices;
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y);
    for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.restore();
}

function drawDropIndicator() {
  if (gameState !== 'playing') return;

  const now      = performance.now();
  const progress = Math.min(1, (now - lastSpawnTime) / SPAWN_INTERVAL_MS);
  const dotY     = 16;
  const pulse    = 1 + 0.18 * Math.sin(now / 130);

  ctx.save();

  // Faint dashed guide line down the drop lane
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth   = 2;
  ctx.setLineDash([6, 10]);
  ctx.beginPath();
  ctx.moveTo(DROP_X, dotY + 22);
  ctx.lineTo(DROP_X, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Ring that fills up as the next ball's drop approaches
  ctx.beginPath();
  ctx.arc(DROP_X, dotY, 13, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth   = 2.5;
  ctx.stroke();

  // Glowing marker at the exact drop point
  ctx.beginPath();
  ctx.arc(DROP_X, dotY, 6 * pulse, 0, Math.PI * 2);
  ctx.fillStyle   = '#fff';
  ctx.shadowBlur  = 18;
  ctx.shadowColor = '#ffd93d';
  ctx.fill();

  ctx.restore();
}

function drawHUD() {
  if (gameState !== 'playing') return;
  const elapsed  = performance.now() - roundStartTime;
  const timeStr  = (elapsed / 1000).toFixed(1) + 's';
  const scoreStr = `${roundMade}/${roundTarget}`;
  const label    = matchMode !== 'solo' ? `PLAYER ${currentPlayer}` : 'TIME';

  ctx.save();
  ctx.textBaseline = 'alphabetic';

  ctx.font = '700 12px Rajdhani, Arial, sans-serif';
  const labelW = ctx.measureText(label).width;
  ctx.font = '800 24px Orbitron, Arial, sans-serif';
  const timeW  = ctx.measureText(timeStr).width;
  const scoreW = ctx.measureText(scoreStr).width;

  const padX      = 26;
  const gap       = 26;
  const leftW     = Math.max(labelW, timeW);
  const rightW    = Math.max(ctx.measureText('BASKETS').width, scoreW);
  const boxW      = padX + leftW + gap + rightW + padX;
  const boxH      = 60;
  const bx = W - boxW - 20, by = 16;  // top-right corner, clear of the drop lane at top-center
  const dividerX  = bx + padX + leftW + gap / 2;

  // Scoreboard chip background
  ctx.fillStyle   = 'rgba(8, 6, 12, 0.6)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.lineWidth   = 1.5;
  roundRect(bx, by, boxW, boxH, boxH / 2);
  ctx.fill();
  ctx.stroke();

  // Divider
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.beginPath();
  ctx.moveTo(dividerX, by + 12);
  ctx.lineTo(dividerX, by + boxH - 12);
  ctx.stroke();

  // Left cell: label + time
  ctx.textAlign = 'left';
  ctx.font      = '700 12px Rajdhani, Arial, sans-serif';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.fillText(label, bx + padX, by + 22);
  ctx.font      = '800 24px Orbitron, Arial, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(timeStr, bx + padX, by + 46);

  // Right cell: baskets made
  const rightCx = dividerX + gap / 2 + rightW / 2;
  ctx.textAlign = 'center';
  ctx.font      = '700 12px Rajdhani, Arial, sans-serif';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.fillText('BASKETS', rightCx, by + 22);
  ctx.font      = '800 24px Orbitron, Arial, sans-serif';
  ctx.fillStyle = '#ffb347';
  ctx.fillText(scoreStr, rightCx, by + 46);

  ctx.restore();
}

function drawTopLeftInfo() {
  // In a duel round, show the running series score here instead of the
  // plain debug readout -- useful context while you're mid-shot.
  if (matchMode === 'duel' && gameState === 'playing') {
    ctx.save();
    ctx.font         = '700 13px Rajdhani, Arial, sans-serif';
    ctx.fillStyle    = 'rgba(255,255,255,0.75)';
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`P1  ${duelScores[1]} – ${duelScores[2]}  P2   ·   ROUND ${duelRound}/${duelSeriesLength}`, 16, 16);
    ctx.restore();
    return;
  }

  ctx.fillStyle    = 'rgba(255,255,255,0.6)';
  ctx.font         = '13px monospace';
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(`cam: ${cameraReady ? currentFacing : '…'}   balls: ${balls.length}   notes: ${noteBodies.length}`, 16, 16);
}

function render() {
  // Draw the latest camera frame as the background (note coordinates were
  // detected in this same frame, so everything lines up automatically).
  if (drawVideoFrame(ctx, W, H)) {
    // Slight dark veil so bright balls/trails read clearly over the video.
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  drawDropIndicator();
  drawHoop();
  drawBalls();
  drawConfetti();
  drawScoreFX();
  drawHUD();
  if (debugMode) drawNoteOutlines();

  drawTopLeftInfo();

  requestAnimationFrame(render);
}


// ── Physics loop ───────────────────────────────────────────────────────────
(function physicsLoop() {
  Engine.update(engine, 1000 / 60);
  checkHoopScoring();
  updateConfetti();
  cleanup();
  setTimeout(physicsLoop, 1000 / 60);
})();


// ── Keyboard shortcuts (desktop) ────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'd' || e.key === 'D') debugMode = !debugMode;
});


// ── Start ──────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
